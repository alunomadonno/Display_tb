<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de @media</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            padding: 20px;
            background-color: rgb(128, 0, 111);
            color: white;
            font-family: Arial,sans-serif;
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
        

        }
        .container-position{
            margin-top:15px;
            width: 100%;
            height: 600%;
            border: 2px solid red;
            position: relative;
            
        }
        .filho-tamanho{
            margin-top: 10px;
            width: 200px;
            height: 200px;
            background-color: blueviolet;
        }
        .filho01__cotainer-position{
            top: 0;
            left: 0;
        }

        .filho02__cotainer-position{
            top: 0;
            right: 0;
        }

        .filho03__cotainer-position{
            top: 0;
            left: 0;
        }

        .filho04__cotainer-position{
            top: 0;
            left: 0;
        }

    
         @media(min-width: 768px){ 
        body{
        background-color: rgb(0, 255, 26);
    }

        .box{
            width: 45%;
            max-width: 600px;
            }}
       
        @media(min-width: 992px){
            body{
                background-color: blueviolet;
                color: rgb(0, 0, 0);
            }
        
            .box{
                width: 300px;
            }}
        

        
    </style>
</head>
<body>
    <h1>este e um teste de media</h1>
    
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position"></div>
    <div class="filho01__container-position"></div>
    <div class="filho02__container-position"></div>
    <div class="filho03__container-position"></div>
    <div class="filho04__ontainer-position"></div>
</body>
</html>
